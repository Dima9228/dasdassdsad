<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Волна — общайся без лишнего</title>
    <meta name="theme-color" content="#0b0d16" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%236d5efc'/%3E%3Cpath d='M14 38c6-14 12-14 18 0s12 14 18 0' stroke='white' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- ЭКРАН ВХОДА -->
    <div class="auth" id="authScreen">
      <div class="auth-glow auth-glow-a"></div>
      <div class="auth-glow auth-glow-b"></div>

      <div class="auth-card">
        <div class="brand brand-lg">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 64 64" width="34" height="34">
              <path d="M12 38c6-15 14-15 20 0s14 15 20 0" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" />
            </svg>
          </span>
          <span class="brand-text">Волна</span>
        </div>

        <h1 class="auth-title">Твой собственный уголок для общения</h1>
        <p class="auth-sub">Серверы, каналы, личные сообщения и живые реакции — всё в реальном времени.</p>

        <div class="auth-tabs" role="tablist">
          <button class="auth-tab is-active" data-mode="login" role="tab">Вход</button>
          <button class="auth-tab" data-mode="register" role="tab">Регистрация</button>
          <span class="auth-tab-pill" aria-hidden="true"></span>
        </div>

        <form id="authForm" class="auth-form" autocomplete="on">
          <label class="field">
            <span class="field-label">Имя пользователя</span>
            <input id="authName" name="username" type="text" placeholder="например, nikita" autocomplete="username" maxlength="20" required />
          </label>
          <label class="field">
            <span class="field-label">Пароль</span>
            <input id="authPass" name="password" type="password" placeholder="минимум 4 символа" autocomplete="current-password" minlength="4" required />
          </label>
          <p class="form-error" id="authError" role="alert"></p>
          <button class="btn btn-primary btn-block" id="authSubmit" type="submit">Войти</button>
        </form>

        <p class="auth-note" id="authNote">Нет аккаунта? <button class="link" data-switch="register">Создать за пару секунд</button></p>
      </div>

      <ul class="auth-features">
        <li><strong>Серверы</strong><span>как в больших мессенджерах</span></li>
        <li><strong>Реальное время</strong><span>сообщения без перезагрузки</span></li>
        <li><strong>Свои данные</strong><span>всё хранится на вашем сервере</span></li>
      </ul>
    </div>

    <!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
    <div class="app is-hidden" id="app">
      <nav class="rail">
        <button class="rail-btn rail-home" id="homeBtn" title="Личные сообщения" aria-label="Личные сообщения">
          <svg viewBox="0 0 64 64" width="26" height="26" aria-hidden="true">
            <path d="M13 39c6-14 13-14 19 0s13 14 19 0" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" />
          </svg>
        </button>
        <div class="rail-sep"></div>
        <div class="rail-servers" id="railServers"></div>
        <button class="rail-btn rail-add" id="addServerBtn" title="Создать сервер" aria-label="Создать сервер">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" /></svg>
        </button>
        <button class="rail-btn rail-add" id="joinServerBtn" title="Присоединиться по коду" aria-label="Присоединиться по коду">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
        </button>
      </nav>

      <aside class="sidebar">
        <header class="sidebar-head" id="sidebarHead"></header>
        <div class="sidebar-body" id="sidebarBody"></div>
        <footer class="user-panel" id="userPanel"></footer>
      </aside>

      <main class="chat" id="chatPane">
        <header class="chat-head" id="chatHead"></header>
        <div class="chat-body">
          <div class="welcome" id="welcome"></div>
          <div class="messages" id="messages" role="log" aria-live="polite"></div>
        </div>
        <button class="jump-bottom is-hidden" id="jumpBottom" type="button">↓ Новые сообщения</button>
        <div class="typing-line" id="typingLine"></div>
        <form class="composer is-hidden" id="composer">
          <div class="composer-box">
            <button class="icon-btn" type="button" id="emojiBtn" title="Эмодзи" aria-label="Эмодзи">
              <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8" /><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /><circle cx="9" cy="10" r="1.2" fill="currentColor" /><circle cx="15" cy="10" r="1.2" fill="currentColor" /></svg>
            </button>
            <textarea id="composerInput" rows="1" placeholder="Написать сообщение…" maxlength="2000"></textarea>
            <button class="send-btn" type="submit" title="Отправить" aria-label="Отправить">
              <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M4 12 20 4l-3.5 16L12 15l-4 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" /></svg>
            </button>
          </div>
          <div class="emoji-pop is-hidden" id="emojiPop"></div>
        </form>
        <div class="no-channel" id="noChannel">
          <div class="no-channel-art">
            <svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true"><path d="M12 38c6-15 14-15 20 0s14 15 20 0" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" /></svg>
          </div>
          <p>Выбери канал слева — и начнём</p>
        </div>
      </main>

      <aside class="members is-hidden" id="membersPane"></aside>
    </div>

    <div class="modal-root is-hidden" id="modalRoot" aria-hidden="true"></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
